<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Archivo, Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI Guest Guide architecture</title>
  <defs>
    <marker id="ink" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a2420"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1f5c46"/>
    </marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a968f"/>
    </marker>
  </defs>

  <rect width="1400" height="960" fill="#f3f5f2"/>

  <text x="60" y="52" font-size="28" font-weight="700" fill="#1a2420">AI Guest Guide architecture</text>
  <text x="60" y="78" font-size="14" fill="#56645c">Next.js 16 (App Router), AI SDK 6, Claude Sonnet 4.6, Prisma 7 + PostgreSQL, Google Places (optional)</text>

  <!-- Client -->
  <rect x="60" y="100" width="1280" height="88" rx="14" fill="#ffffff" stroke="#d5ddd5"/>
  <text x="84" y="126" font-size="13" font-weight="700" fill="#56645c">Client</text>
  <rect x="520" y="112" width="360" height="64" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="700" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Browser</text>
  <text x="700" y="160" text-anchor="middle" font-size="12" fill="#56645c">Property page, local guide and chat (pt-BR)</text>

  <line x1="700" y1="188" x2="700" y2="218" stroke="#1f5c46" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="712" y="208" font-size="12" font-weight="600" fill="#1f5c46">HTTPS, through the deploy proxy</text>

  <!-- Next.js -->
  <rect x="60" y="222" width="1280" height="150" rx="14" fill="#ffffff" stroke="#d5ddd5"/>
  <text x="84" y="248" font-size="13" font-weight="700" fill="#56645c">Next.js App Router</text>

  <rect x="80" y="262" width="292" height="92" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="226" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">app/page.tsx</text>
  <text x="226" y="316" text-anchor="middle" font-size="12" fill="#56645c">Landing with the</text>
  <text x="226" y="334" text-anchor="middle" font-size="12" fill="#56645c">property list</text>

  <rect x="396" y="262" width="292" height="92" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="542" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">app/[code]/page.tsx</text>
  <text x="542" y="316" text-anchor="middle" font-size="12" fill="#56645c">Property page,</text>
  <text x="542" y="334" text-anchor="middle" font-size="12" fill="#56645c">server-rendered</text>

  <rect x="712" y="262" width="292" height="92" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="858" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">api/generate-guide</text>
  <text x="858" y="316" text-anchor="middle" font-size="12" fill="#56645c">Cached guide, or generate once</text>
  <text x="858" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5c46">429 past a limit</text>

  <rect x="1028" y="262" width="292" height="92" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="1174" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">api/chat</text>
  <text x="1174" y="316" text-anchor="middle" font-size="12" fill="#56645c">Streaming answers</text>
  <text x="1174" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5c46">text-only history, limits</text>

  <line x1="700" y1="372" x2="700" y2="410" stroke="#1a2420" stroke-width="2" marker-end="url(#ink)"/>
  <text x="712" y="396" font-size="12" font-weight="600" fill="#1a2420">function calls</text>

  <!-- Services -->
  <rect x="60" y="414" width="1280" height="128" rx="14" fill="#ffffff" stroke="#d5ddd5"/>
  <text x="84" y="440" font-size="13" font-weight="700" fill="#56645c">Services (lib/services)</text>

  <rect x="80" y="454" width="292" height="70" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="226" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">property.service</text>
  <text x="226" y="505" text-anchor="middle" font-size="12" fill="#56645c">Find and list properties</text>

  <rect x="396" y="454" width="292" height="70" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="542" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">usage.service</text>
  <text x="542" y="505" text-anchor="middle" font-size="12" fill="#56645c">IP quotas, daily token budget</text>

  <rect x="712" y="454" width="292" height="70" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="858" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">guide.service</text>
  <text x="858" y="505" text-anchor="middle" font-size="12" fill="#56645c">Cache-aside, the only generator</text>

  <rect x="1028" y="454" width="292" height="70" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="1174" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">places.service</text>
  <text x="1174" y="505" text-anchor="middle" font-size="12" fill="#56645c">Real venues for grounding</text>

  <line x1="226" y1="542" x2="226" y2="606" stroke="#1a2420" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="542" y1="542" x2="542" y2="606" stroke="#1a2420" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="780" y1="542" x2="664" y2="606" stroke="#1a2420" stroke-width="2" marker-end="url(#ink)"/>
  <text x="732" y="586" font-size="12" font-weight="600" fill="#1a2420">cache</text>
  <line x1="900" y1="542" x2="900" y2="606" stroke="#1f5c46" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="912" y="580" font-size="12" font-weight="600" fill="#1f5c46">model calls</text>
  <line x1="1174" y1="542" x2="1174" y2="606" stroke="#8a968f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
  <text x="1186" y="580" font-size="12" font-weight="600" fill="#56645c">optional</text>

  <!-- External -->
  <rect x="60" y="610" width="1280" height="150" rx="14" fill="#ffffff" stroke="#d5ddd5"/>
  <text x="84" y="636" font-size="13" font-weight="700" fill="#56645c">External services</text>

  <rect x="80" y="650" width="608" height="92" rx="10" fill="#e8ece7" stroke="#c9d3ca" stroke-width="1.5"/>
  <text x="384" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">PostgreSQL</text>
  <text x="384" y="704" text-anchor="middle" font-size="12" fill="#56645c">properties, generated_guides (guide cache),</text>
  <text x="384" y="722" text-anchor="middle" font-size="12" fill="#56645c">usage_counters (quotas and tokens per day)</text>

  <rect x="712" y="650" width="292" height="92" rx="10" fill="#e8ece7" stroke="#c9d3ca" stroke-width="1.5"/>
  <text x="858" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Anthropic API</text>
  <text x="858" y="704" text-anchor="middle" font-size="12" fill="#56645c">Claude Sonnet 4.6: the guide,</text>
  <text x="858" y="722" text-anchor="middle" font-size="12" fill="#56645c">and the chat from api/chat</text>

  <rect x="1028" y="650" width="292" height="92" rx="10" fill="#e8ece7" stroke="#c9d3ca" stroke-width="1.5"/>
  <text x="1174" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Google Places API</text>
  <text x="1174" y="704" text-anchor="middle" font-size="12" fill="#56645c">Used only when</text>
  <text x="1174" y="722" text-anchor="middle" font-size="12" fill="#56645c">GOOGLE_PLACES_API_KEY is set</text>

  <!-- Notes -->
  <rect x="60" y="790" width="400" height="140" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="80" y="816" font-size="14" font-weight="700" fill="#1a2420">Cost limits</text>
  <text x="80" y="840" font-size="12" fill="#1a2420">Per-IP quotas and a daily token budget,</text>
  <text x="80" y="858" font-size="12" fill="#1a2420">counted in Postgres. Past a limit the app</text>
  <text x="80" y="876" font-size="12" fill="#1a2420">answers without calling the model.</text>
  <text x="80" y="910" font-size="11" font-style="italic" fill="#56645c">usage.service</text>

  <rect x="500" y="790" width="400" height="140" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="520" y="816" font-size="14" font-weight="700" fill="#1a2420">Grounded chat</text>
  <text x="520" y="840" font-size="12" fill="#1a2420">Answers only from the property data and</text>
  <text x="520" y="858" font-size="12" fill="#1a2420">the cached guide. Its 9 rules are checked</text>
  <text x="520" y="876" font-size="12" fill="#1a2420">against the real model by npm run evals.</text>
  <text x="520" y="910" font-size="11" font-style="italic" fill="#56645c">lib/ai/prompts/chat.ts, evals/</text>

  <rect x="940" y="790" width="400" height="140" rx="10" fill="#dde6dd" stroke="#1f5c46" stroke-width="1.5"/>
  <text x="960" y="816" font-size="14" font-weight="700" fill="#1a2420">Grounded guide</text>
  <text x="960" y="840" font-size="12" fill="#1a2420">With a Places key, the model picks only from</text>
  <text x="960" y="858" font-size="12" fill="#1a2420">real venues. Without it, a stricter prompt</text>
  <text x="960" y="876" font-size="12" fill="#1a2420">falls back to the model's own knowledge.</text>
  <text x="960" y="910" font-size="11" font-style="italic" fill="#56645c">lib/ai/prompts/guide-generator.ts</text>
</svg>
